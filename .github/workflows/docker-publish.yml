name: Build, Test & Publish to GHCR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rust

      - name: Run Test Suite (Cargo Test)
        run: |
          cargo test --manifest-path backend-rust/Cargo.toml --verbose

      - name: Set up QEMU (Multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Git Metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image (amd64 + arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DOCSEEKER_VERSION=2.0.0-${{ steps.meta.outputs.short_sha }}
            GIT_COMMIT=${{ steps.meta.outputs.short_sha }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/docseeker-app:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/docseeker-app:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/docseeker-app:2.0.0
            ghcr.io/${{ steps.meta.outputs.owner }}/docseeker-app:2.0.0-${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/docseeker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
