name: Build, Test & Publish to GHCR (Ultra-Rapide & Parallèle)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Exécution des tests unitaires et d'intégration
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rust

      - name: Run Test Suite (Cargo Test)
        run: cargo test --manifest-path backend-rust/Cargo.toml

  # ---------------------------------------------------------------------------
  # 2. Compilation parallèle des images Docker (AMD64 & ARM64 en simultané)
  # ---------------------------------------------------------------------------
  build-image:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute Git Metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | tr '/' '-')
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT
          echo "platform_tag=${PLATFORM_TAG}" >> $GITHUB_OUTPUT

      - name: Set up QEMU (Pour ARM64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform-specific image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            DOCSEEKER_VERSION=2.0.0-${{ steps.meta.outputs.short_sha }}
            GIT_COMMIT=${{ steps.meta.outputs.short_sha }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/docseeker-app:${{ steps.meta.outputs.platform_tag }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

  # ---------------------------------------------------------------------------
  # 3. Fusion des manifests multi-architecture (En quelques secondes)
  # ---------------------------------------------------------------------------
  create-manifest:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Compute Git Metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          IMAGE="ghcr.io/${{ steps.meta.outputs.owner }}/docseeker-app"
          docker buildx imagetools create -t ${IMAGE}:latest \
            -t ${IMAGE}:2.0.0 \
            -t ${IMAGE}:2.0.0-${{ steps.meta.outputs.short_sha }} \
            -t ${IMAGE}:${{ steps.meta.outputs.short_sha }} \
            ${IMAGE}:linux-amd64 ${IMAGE}:linux-arm64
