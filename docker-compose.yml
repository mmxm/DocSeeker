services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/mmxm/docseeker-app:latest
    container_name: docseeker_app
    restart: unless-stopped
    ports:
      - "${HOST_HTTP_PORT:-8080}:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      # Mot de passe administrateur initial (personnalisable ou configurable au 1er boot)
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin1234}
      # UID / GID Synology (par défaut 1026:100 sur DSM) pour éviter toute erreur de permission
      - PUID=${PUID:-1026}
      - PGID=${PGID:-100}
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-2GB}
    # Consommation mémoire drastiquement réduite grâce à Rust (divisée par 8)
    mem_limit: 256m
    mem_reservation: 64m
    volumes:
      # Persistance de la base SQLite et des documents/vignettes
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
