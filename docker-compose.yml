services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/mmxm/docseeker-app:latest
    container_name: docseeker_app
    restart: unless-stopped
    ports:
      # Port hôte : Port conteneur
      - "8080:8080"
    environment:
      # Configuration Réseau
      - HOST=0.0.0.0
      - PORT=8080
      - DATA_DIR=/app/data

      # Authentification Administrateur (haché automatiquement en Argon2id au boot)
      # Modifiez simplement la valeur ci-dessous pour changer votre mot de passe
      - ADMIN_PASSWORD=admin1234

      # Durée de session en jours
      - SESSION_DURATION_DAYS=30

      # Permissions Synology DSM (1026:100 par défaut sur Synology)
      - PUID=1026
      - PGID=100

      # Taille maximale d'import PDF (ex: 2GB, 500MB)
      - MAX_UPLOAD_SIZE=2GB

    # Consommation mémoire dimensionnée pour grands corpus médicaux (PDF de 800 Mo)
    mem_limit: 2048m
    mem_reservation: 256m
    volumes:
      # Persistance des données (documents originaux, base SQLite et vignettes)
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/docseeker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
