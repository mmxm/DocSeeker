[package]
name = "search-core"
version = "0.1.0"
edition = "2021"
description = "Moteur algorithmique commun, structures DTO et requêtes SQL pour DocSeeker"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
lazy_static = "1.5"
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
urlencoding = "2.1"
