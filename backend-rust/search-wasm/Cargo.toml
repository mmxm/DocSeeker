[package]
name = "search-wasm"
version = "0.1.0"
edition = "2021"
description = "Moteur de recherche et découpage spatial d'occurrences pour DocSeeker compilé en WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
search-core = { path = "../crates/search-core" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"
