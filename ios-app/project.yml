name: DocSeeker
options:
  bundleIdPrefix: com.docseeker
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2" # 1 = iPhone, 2 = iPad
    DEVELOPMENT_TEAM: "8UDMMKDNM2"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ARCHS: "arm64"
    ONLY_ACTIVE_ARCH: YES

targets:
  DocSeeker:
    type: application
    platform: iOS
    sources:
      - path: DocSeeker
    dependencies:
      - framework: Frameworks/DocSeekerCore.xcframework
      - sdk: PDFKit.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: UniformTypeIdentifiers.framework
    info:
      path: DocSeeker/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.docseeker.app
        DEVELOPMENT_TEAM: "8UDMMKDNM2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_OBJC_BRIDGING_HEADER: "DocSeeker/DocSeeker-Bridging-Header.h"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DocSeekerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DocSeekerTests
    dependencies:
      - target: DocSeeker
    info:
      path: DocSeekerTests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.docseeker.app.tests
        DEVELOPMENT_TEAM: "8UDMMKDNM2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_OBJC_BRIDGING_HEADER: "DocSeeker/DocSeeker-Bridging-Header.h"

  DocSeekerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DocSeekerUITests
    dependencies:
      - target: DocSeeker
    info:
      path: DocSeekerUITests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.docseeker.app.uitests
        DEVELOPMENT_TEAM: "CL4AL3X94A"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"

schemes:
  DocSeeker:
    build:
      targets:
        DocSeeker: all
    run:
      target: DocSeeker
    test:
      targets:
        - DocSeekerTests
        - DocSeekerUITests
